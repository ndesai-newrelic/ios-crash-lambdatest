  ios-explore-data:
    name: Generate iOS explore data
    needs: [ios-todo-data, android-todo-data]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      LT_USERNAME: ${{ secrets.APP_EXP_LAMBDA_USERNAME }}
      LT_ACCESSKEY: ${{ secrets.APP_EXP_LAMBDA_ACCESS_KEY }}
      CUSTOM_APP_ID_IOS: "IOSAPP_STAGING"
