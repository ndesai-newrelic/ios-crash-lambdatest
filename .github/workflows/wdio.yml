# The purpose of this GitHub action is to have a constant stream of data reporting to the following entities:
  # main-agent-test-app-ios: https://staging.onenr.io/07jbMl8KnRy
  # main-agent-test-app-android: https://staging.onenr.io/0EjOeXJOOw6

# This is accomplished by triggering npm scripts that execute a suite of tests in parallel
# The tests spin up simulated iOS and Android devices on LambdaTest that are instrumented with the Mobile agent

name: 'WDIO: automate iOS and Android tests'

on:
  # enables option for workflow to be manually executed in Github UI
  workflow_dispatch:
  
  # TODO: add scheduled execution of workflow once confirmed it's working manually
  # schedule:
  #   - cron: '*/30 * * * *' # run every 30 min
env:
  # TODO: get team sso access to log into service account
  LT_USERNAME: ${{ secrets.LAMBDA_USERNAME }}
  LT_ACCESSKEY: ${{ secrets.LAMBDA_ACCESS_KEY }}
jobs:
  ios-data:
    name: Generate iOS data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/env-setup
        
      - name: Execute iOS tests
        run: for i in {1..10}; do npm run test:wdio-ios; done
        
      - name: Log success
        if: ${{ success() }}
        run: echo "[ RUNNER ] - successfully executed iOS tests" 
        
      - name: Log failure
        if: ${{ failure() }}
        run: echo "[ RUNNER ] - failed to execute iOS tests" 
  android-data:
    name: Generate Android data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        uses: ./.github/actions/env-setup
        
      - name: Execute Android tests
        run:  for i in {1..10}; do npm run test:wdio-android; done
        
      - name: Log success
        if: ${{ success() }}
        run: echo "[ RUNNER ] - successfully executed Android tests" 
        
      - name: Log failure
        if: ${{ failure() }}
        run: echo "[ RUNNER ] - failed to execute Android tests" 
