        run: echo "[ RUNNER ] - failed to execute Android explore tests"

  ios-crash-data:
    name: Generate iOS crash data
    needs: [ios-explore-data, android-explore-data]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      LT_USERNAME: ${{ secrets.APP_EXP_LAMBDA_USERNAME }}
      LT_ACCESSKEY: ${{ secrets.APP_EXP_LAMBDA_ACCESS_KEY }}
      CUSTOM_APP_ID_IOS: "IOSAPP_STAGING"
