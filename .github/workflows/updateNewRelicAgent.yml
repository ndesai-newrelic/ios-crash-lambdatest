      - name: Summary
        if: steps.get-version.outputs.update_needed == 'true'
        run: |
          echo "✅ Created PR to update New Relic Android agent from ${{ steps.get-version.outputs.current_version }} to ${{ steps.get-version.outputs.latest_version }}"

      - name: No Update Needed
        if: steps.get-version.outputs.update_needed == 'false'
        run: |
          echo "ℹ️ New Relic Android agent is already up to date (version: ${{ steps.get-version.outputs.current_version }})"