name: Update New Relic Agent

on:
  # Allow manual trigger
  workflow_dispatch: 

  push:
    branches:
      - main

  # Run every Monday at 9:00 AM UTC
  # schedule:
  #   - cron: "0 9 * * 1"
    
jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest New Relic React Native version  
        id: get-version-react-native
        run: |
          # Fetch latest version from NPM
          LATEST_VERSION=$(npm view newrelic-react-native-agent version)

          echo "Latest React Native version: $LATEST_VERSION"
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT

          CURRENT_VERSION=$(grep 'newrelic-react-native-agent' package.json | grep -o '[0-9]\+\(\.[0-9]\+\)*')

          echo "Current version: $CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
          # Check if update is needed
          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ] && [[ "$LATEST_VERSION" != "" ]]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "Update needed: $CURRENT_VERSION -> $LATEST_VERSION"
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "Already on latest version"
          fi

      - name: Get latest New Relic Android Agent version
        id: get-version-android
        run: |
          # Fetch the latest release version from Maven Central metadata XML
          # This is more reliable than the search API for getting the absolute latest version
          LATEST_VERSION=$(curl -s "https://repo1.maven.org/maven2/com/newrelic/agent/android/android-agent/maven-metadata.xml" | \
            grep -oP '<release>\K[^<]+' | head -1)

          echo "Latest version: $LATEST_VERSION"
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT

          # Get current version from build.gradle
          cd android
          CURRENT_VERSION=$(grep -oP "classpath ['\"]com\.newrelic\.agent\.android:agent-gradle-plugin:\K[^'\"]+(?=['\"])" build.gradle)
          
          echo "Current version: $CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Check if update is needed (skip SNAPSHOT versions)
          if [[ "$CURRENT_VERSION" == *"SNAPSHOT"* ]]; then
            echo "Current version is SNAPSHOT, comparing with latest release"
          fi

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ] && [[ "$LATEST_VERSION" != "" ]]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "Update needed: $CURRENT_VERSION -> $LATEST_VERSION"
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "Already on latest version"
          fi

      - name: Update New Relic agent version
        if: steps.get-version-react-native.outputs.update_needed
        run: |
          REACT_NATIVE_LATEST_VERSION="${{ steps.get-version-react-native.outputs.latest_version }}"
          REACT_NATIVE_CURRENT_VERSION="${{ steps.get-version-react-native.outputs.current_version }}"

          ANDROID_LATEST_VERSION="${{ steps.get-version-android.outputs.latest_version }}"
          ANDROID_CURRENT_VERSION="${{ steps.get-version-android.outputs.current_version }}"

          # Update build.gradle - agent-gradle-plugin classpath
          cd android
          sed -i "s/com.newrelic.agent.android:agent-gradle-plugin:$ANDROID_CURRENT_VERSION/com.newrelic.agent.android:agent-gradle-plugin:$ANDROID_LATEST_VERSION/g" build.gradle

          # Update package.json - newrelic-react-native-agent version
          cd ..
          sed -i "s/\"newrelic-react-native-agent\": \"^$REACT_NATIVE_CURRENT_VERSION\"/\"newrelic-react-native-agent\": \"^$REACT_NATIVE_LATEST_VERSION\"/g" package.json
          
          # Update pods
          # npx pod install --repo-update

          echo "Updated New Relic react-native agent from $REACT_NATIVE_CURRENT_VERSION to $REACT_NATIVE_LATEST_VERSION"

      - name: Create Pull Request
        if: steps.get-version-react-native.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: Update New Relic react-native agent to ${{ steps.get-version-react-native.outputs.latest_version }}"
          title: "chore: Update New Relic react-native agent to ${{ steps.get-version-react-native.outputs.latest_version }}"
          body: |
            ## Description
            This PR updates the New Relic react-native agent to the latest version.

            **Current version:** `${{ steps.get-version-react-native.outputs.current_version }}`
            **Latest version:** `${{ steps.get-version-react-native.outputs.latest_version }}`

            ## Changes
            - Update the New Relic react-native agent version in `package.json`
            - Updated `com.newrelic.agent.android:agent-gradle-plugin` in `build.gradle`
            - Updated CocoaPods dependencies

            ---
            🤖 This PR was automatically generated by the Update New Relic Agent workflow.
          branch: update-newrelic-agent-${{ steps.get-version-react-native.outputs.latest_version }}
          delete-branch: true
          labels: |
            dependencies
            automated
            newrelic

      - name: Summary
        if: steps.get-version-react-native.outputs.update_needed == 'true'
        run: |
          echo "✅ Created PR to update New Relic react-native agent"

      - name: No Update Needed
        if: steps.get-version-react-native.outputs.update_needed == 'false' && steps.get-version-android.outputs.update_needed == 'false'
        run: |
          echo "ℹ️ New Relic react-native agent is already up to date (version: ${{ steps.get-version-react-native.outputs.current_version }})"