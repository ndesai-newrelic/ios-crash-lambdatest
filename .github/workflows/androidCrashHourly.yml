# Every-30-min Android crash data generation against a user-configured
# LambdaTest app. Mirrors iosCrashHourly.yml. Triggered by cron-job.org on
# :28/:58 via the workflow_dispatch API (offset from the iOS workflow's
# :13/:43 so the two don't hit LambdaTest in the same minute) — GitHub's
# native scheduler was dropping runs to 1-5h gaps in this repo.

name: "Android crash - every 30 min data generation"

on:
  workflow_dispatch:

jobs:
  android-crash-data:
    name: Generate Android crash data
    runs-on: ubuntu-latest
    env:
      LT_USERNAME:           ${{ secrets.LT_USERNAME }}
      LT_ACCESSKEY:          ${{ secrets.LT_ACCESSKEY }}
      CUSTOM_APP_ID_ANDROID: ${{ vars.CUSTOM_APP_ID_ANDROID }}
      ENVIRONMENT:           ${{ vars.ENVIRONMENT || 'staging' }}
      TEST:                  "./android-crash.js"
    steps:
      - uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/env-setup

      - name: Execute Android crash tests
        run: npm run test:wdio-android

      - name: Log success
        if: ${{ success() }}
        run: echo "[ RUNNER ] - successfully executed Android crash tests"

      - name: Log failure
        if: ${{ failure() || cancelled() }}
        run: echo "[ RUNNER ] - failed to execute Android crash tests"
