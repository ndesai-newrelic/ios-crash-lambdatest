# This purpose of this GitHub action is to automate uploading the main agent test app to LamdbaTest. LambdaTest has a retention policy of 60 days. This automation ensures that the app is always available for testing without manual intervention and will always be providing data to the following entities without interruption:

# main-agent-test-app-ios: https://staging.onenr.io/07jbMl8KnRy
# main-agent-test-app-android: https://staging.onenr.io/0EjOeXJOOw6

# This action triggers a node.js function that uploads the app to LambdaTest.
# The function uses a `custom_id` to identify that app with a specific name rather than the default names provided upon upload, which will change per upload.

name: Upload iOS and Android apps to LambdaTest

on:
  # enables option for workflow to be manually executed in Github UI
  workflow_dispatch:

  # Runs on the 1st of every month
  schedule:
    - cron: "0 0 1 * *"

jobs:
  upload-apps:
    name: Upload main agent test apps to LT
    runs-on: ubuntu-latest
    env:
      # TODO: get team sso access to log into service account
      LAMBDA_USERNAME: ${{ secrets.LAMBDA_USERNAME }}
      LAMBDA_ACCESS_KEY: ${{ secrets.LAMBDA_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2 # pin@v4

      - name: Setup environment
        uses: ./.github/actions/env-setup

      - name: Run upload script
        run: node lambdaTest/uploadAppToLambdaTest.mjs

      - name: Log success
        if: ${{ success() }}
        run: echo "[ RUNNER ] - successfully uploaded apps to LambdaTest"

      - name: Notify success
        if: ${{ success() }}
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # pin@v
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: ":frog-wow-scroll: LambdaTest Upload Successful"
              - type: "divider"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: Congrats! We survived another month to claim victory over LambdaTest's retention policy. The apps have been successfully uploaded and are ready for testing.
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "You can view the apps here:"
                fields:
                  - type: "mrkdwn"
                    text: *iOS App:* (main-agent-test-app Android)[https://staging-one.newrelic.com/nr1-core/mobile/home/MTIxNDgyNzF8TU9CSUxFfEFQUExJQ0FUSU9OfDY0MzkyODE2?duration=1800000]
                  - type: "mrkdwn"
                    text: *Android App:* (main-agent-test-app iOS)[https://staging-one.newrelic.com/nr1-core/mobile/home/MTIxNDgyNzF8TU9CSUxFfEFQUExJQ0FUSU9OfDY0MzkyODIz?duration=1800000]
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Log failure
        if: ${{ failure() || cancelled() }}
        run: echo "[ RUNNER ] - failed to upload apps to LambdaTest"

      - name: Notify failure
        if: ${{ failure() || cancelled() }}
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # pin@v2
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: ":crying-sunglasses-cowboy: LambdaTest Upload Failed"
              - type: "divider"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "Something went wrong while uploading the apps to LambdaTest. Please check the logs for more details." 
                accessory:
                  type: "button"
                  text:
                    type: "plain_text"
                    text: "View logs"
                    emoji: true
                  value: "view_logs"
                  url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  action_id: "button-action"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
